<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>สมุดคุมเลขสารบรรณ</title>
  <meta name="description" content="ระบบสมุดคุมเลขรับ-เลขส่ง และสมุดคุมเลขรับคำร้องทั่วไป">
  <meta name="theme-color" content="#f4f1ea">
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
  <script>
    // ใช้ธีมล่าสุดทันทีก่อนโหลดสคริปต์ (กันจอกระพริบ)
    try { const v = JSON.parse(localStorage.getItem('ledger.themeVars') || 'null'); if (v) for (const k in v) document.documentElement.style.setProperty(k, v[k]); } catch (e) {}
  </script>
</head>
<body>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
  <div id="app"><div class="boot"><div class="boot-mark"></div></div></div>
  <div id="toasts" role="status" aria-live="polite"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
